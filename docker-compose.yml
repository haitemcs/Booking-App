services:

  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: roombooking
      POSTGRES_USER: roombooking
      POSTGRES_PASSWORD: roombooking_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roombooking -d roombooking"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./backend

    env_file:
      - ./backend/.env

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    volumes:
      - ./backend/booking_backend:/app

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    depends_on:
      - web

volumes:
  postgres_data:
